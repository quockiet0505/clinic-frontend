appId: com.clinic.management
---
# Luồng Hủy lịch khám (TC 3.1)
- launchApp:
    clearState: false

- tapOn: "Lịch khám của tôi"
- tapOn: "Mã phiếu khám:" # Chọn phiếu đầu tiên
- swipe:
    direction: UP
- tapOn: "Hủy lịch hẹn"

- tapOn: "Tôi bận việc đột xuất"
- tapOn: "Xác nhận hủy"

- assertVisible: "Đã hủy"
