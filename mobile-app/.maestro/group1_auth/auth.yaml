appId: com.clinic.management # Cần thay bằng appId thật trong android/app/build.gradle
---
# Luồng Đăng nhập (TC 1.2)
- launchApp:
    clearState: true # Bắt đầu app từ trạng thái trắng (chưa đăng nhập)

- tapOn: "Đăng nhập" # Tìm nút có chữ Đăng nhập
- inputText: "0901234567" # Nhập số điện thoại
- tapOn: "Tiếp tục"

- tapOn: "Mật khẩu"
- inputText: "123456"
- tapOn: "Xác nhận"

# Kiểm tra xem có chuyển vào màn hình Home thành công không
- assertVisible: "Chào mừng, Nguyen Van A"
- assertVisible: "Đặt lịch khám"
