appId: com.clinic.management
---
# Luồng Chat với AI (TC 8.1, 8.2)
- launchApp:
    clearState: false

- tapOn: "Trợ lý AI" # Hoặc icon chatbot

- tapOn: "Nhập tin nhắn..."
- inputText: "Phòng khám mấy giờ mở cửa vậy?"
- tapOn: "Gửi"

# Đợi phản hồi (có thể lên tới 5-10s cho AI)
- extendedWaitUntil:
    visible: "Phòng khám mở cửa từ 8:00 đến 17:00"
    timeout: 10000

- tapOn: "Nhập tin nhắn..."
- inputText: "Tôi bị đau đầu chóng mặt thì khám khoa nào?"
- tapOn: "Gửi"

- extendedWaitUntil:
    visible: "Khoa Nội Thần Kinh"
    timeout: 10000
